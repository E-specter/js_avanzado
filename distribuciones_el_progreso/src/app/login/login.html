<main>
  <h1>Iniciar sesión</h1>

  <form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)">
    <div>
      <label for="username">Usuario</label>
      <input
        #username="ngModel"
        id="username"
        name="username"
        type="text"
        autocomplete="username"
        required
        ngModel
        aria-describedby="username-error"
      >
      @if (username.invalid && (username.touched || loginForm.submitted)) {
        <p id="username-error">El usuario es obligatorio.</p>
      }
    </div>

    <div>
      <label for="password">Contraseña</label>
      <input
        #password="ngModel"
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
        ngModel
        aria-describedby="password-error"
      >
      @if (password.invalid && (password.touched || loginForm.submitted)) {
        <p id="password-error">La contraseña es obligatoria.</p>
      }
    </div>

    <button type="submit">Iniciar sesión</button>
    <p role="status" aria-live="polite">{{ message }}</p>
  </form>
</main>
